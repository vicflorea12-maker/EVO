<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business English — Worttrainer</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d32;--line:#263653;--text:#eef4ff;--muted:#9eacc5;--accent:#79a8ff;--good:#39c98a;--bad:#ff6b78}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 0%,#1b3155 0,transparent 45%),linear-gradient(145deg,#080d19,#101a2d);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
.app{width:min(680px,100%);background:rgba(20,29,50,.96);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 25px 80px #0008}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:28px}.tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:800}.counter{color:var(--muted);font-size:14px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px}.sub{color:var(--muted);margin:0 0 28px}
.progress{height:7px;background:#263653;border-radius:20px;overflow:hidden;margin-bottom:30px}.bar{height:100%;width:0;background:linear-gradient(90deg,#6c9cff,#8e7bff);transition:width .25s}
.prompt-label{font-size:13px;color:var(--muted);margin-bottom:10px}.word{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-1px;margin-bottom:26px;overflow-wrap:anywhere}
.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;padding:17px 19px;border:1px solid var(--line);border-radius:14px;background:#192640;color:var(--text);font-size:16px;font-weight:600;cursor:pointer;transition:.15s}.answer:hover:not(:disabled){border-color:var(--accent);background:#203354;transform:translateY(-1px)}.answer:disabled{cursor:default}.answer.correct{border-color:var(--good);background:#123b34}.answer.wrong{border-color:var(--bad);background:#40232f}.answer .letter{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#2a3b5b;color:#bcd0f5;margin-right:12px;font-size:13px}
.feedback{min-height:28px;margin:18px 0 6px;font-weight:700}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px}.score{color:var(--muted);font-size:14px}.btn{border:0;border-radius:12px;background:var(--accent);color:#091326;padding:13px 22px;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.35;cursor:not-allowed}.result{text-align:center;padding:20px 0}.result .big{font-size:64px;margin:8px}.result h2{font-size:30px;margin:8px}.result p{color:var(--muted);line-height:1.6}
@media(max-width:480px){.bottom{align-items:stretch;flex-direction:column}.btn{width:100%}.counter{white-space:nowrap}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="tag">Business English · Worttrainer</div><div class="counter" id="counter">1 / 22</div></div>
  <h1>Finde die richtige Übersetzung</h1>
  <p class="sub">Выбери правильный перевод немецкого слова.</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <section id="game">
    <div class="prompt-label">WAS BEDEUTET DIESES WORT AUF ENGLISCH?</div>
    <div class="word" id="word">Technik</div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="bottom"><div class="score" id="score">Правильно: 0</div><button class="btn" id="next" disabled>Далее →</button></div>
  </section>
  <section class="result" id="result" hidden></section>
</main>
<script>
const words = [
 ["Technik","Engineering"],
 ["Kundenberatung","Customer Service"],
 ["Qualitätssicherung","Quality control"],
 ["Einkauf","Purchasing"],
 ["Forschung und Entwicklung","R&D"],
 ["Vertrieb","Sales and marketing"],
 ["Personalverwaltung","HR"],
 ["Buchführung","Accounts"],
 ["Betrieb","operations"],
 ["Anbieter","provider"],
 ["Leistung","output"],
 ["Lösungen","solutions"],
 ["Sicherheit","security"],
 ["Lagerbestand","stock"],
 ["Standorte","locations"],
 ["Kunde/Kundinnen","clients"],
 ["Abläufe/ Prozesse","processes"],
 ["Mit Sitz in...","based in"],
 ["Nutzer/in","user"],
 ["Ergebnisse","results"],
 ["Fertigungskapazität","production capacity"],
 ["Produkte und Dienstleistungen","products and services"]
];
let order=[],index=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(words.map((_,i)=>i));index=0;score=0;answered=false;$("game").hidden=false;$("result").hidden=true;render()}
function render(){
 answered=false;const pair=words[order[index]];
 $("counter").textContent=`${index+1} / ${words.length}`;$("bar").style.width=`${index/words.length*100}%`;
 $("word").textContent=pair[0];$("feedback").textContent="";$("feedback").className="feedback";
 $("score").textContent=`Правильно: ${score}`;$("next").disabled=true;$("next").textContent=index===words.length-1?"Результат":"Далее →";
 let choices=shuffle([pair[1],...shuffle(words.filter((_,i)=>i!==order[index]).map(x=>x[1])).slice(0,3)]);
 $("answers").innerHTML="";
 choices.forEach((choice,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${"ABCD"[i]}</span>${choice}`;b.addEventListener("click",()=>choose(b,choice,pair[1]));$("answers").appendChild(b)});
}
function choose(button,choice,correct){
 if(answered)return;answered=true;
 [...$("answers").children].forEach(b=>{b.disabled=true;if(b.textContent.trim().slice(1).trim()===correct)b.classList.add("correct")});
 if(choice===correct){score++;$("feedback").textContent="Richtig! Отлично!";$("feedback").className="feedback good"}
 else{$("feedback").textContent=`Leider falsch. Правильный ответ: ${correct}`;$("feedback").className="feedback bad";button.classList.add("wrong")}
 $("score").textContent=`Правильно: ${score}`;$("next").disabled=false;$("bar").style.width=`${(index+1)/words.length*100}%`;
}
function finish(){
 $("game").hidden=true;$("result").hidden=false;let pct=Math.round(score/words.length*100);
 let message=pct===100?"Perfekt! Все ответы правильные.":pct>=75?"Sehr gut! Отличный результат.":pct>=50?"Gut gemacht! Продолжай тренироваться.":"Übung macht den Meister! Попробуй ещё раз.";
 $("counter").textContent="Fertig";$("bar").style.width="100%";
 $("result").innerHTML=`<div class="big">${pct>=75?"🏆":"📚"}</div><h2>${score} / ${words.length} richtig</h2><p>${message}<br>Твой результат: ${pct}%</p><button class="btn" onclick="start()">Играть ещё раз ↻</button>`;
}
$("next").addEventListener("click",()=>{if(!answered)return;if(index<words.length-1){index++;render()}else finish()});
start();
</script>
</body>
</html>
